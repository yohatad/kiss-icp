kiss_icp_node:
  ros__parameters:
    # Frames — must match the Pepper TF tree
    base_frame: "base_footprint"        # Pepper's root frame
    lidar_odom_frame: "odom"            # standard REP-105 odom frame
    publish_odom_tf: true               # KISS-ICP owns odom -> base_footprint
    invert_odom_tf: false
    position_covariance: 0.1
    orientation_covariance: 0.1

    data:
      deskew: true        # uses per-point timestamps inside the L2 scan
      max_range: 30.0     # indoor Pepper environment; L2 hardware max is 100 m
      min_range: 0.5      # avoid self-hits from Pepper's body / arms

    mapping:
      max_points_per_voxel: 20

    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1    # increase to ~0.3 if odometry drifts while stationary

    # Motion prior for the ICP initial guess. "constant_velocity" is upstream
    # KISS-ICP; "wheel_odom" uses Pepper's fused wheel+IMU odometry (/pepper_odom)
    # and falls back to constant velocity when no odometry brackets the scan.
    prior:
      source: wheel_odom
      odom_topic: /pepper_odom
      max_age: 0.2          # s; oldest odometry accepted for interpolation
      rotation_only: false  # true = take only rotation from odometry, translation from ICP
